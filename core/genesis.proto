}

// Distances fm, vitesses m/s, moments en magnétons nucléaires signés.
message CollisionBody {
  int32 z = 1;
  int32 a = 2;
  string label = 3;
  repeated double position = 4;
  repeated double velocity = 5;
  repeated double spin = 6;
  double radius_fm = 7;
