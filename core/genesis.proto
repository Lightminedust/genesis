  double excitation_mev = 13;
  string kind = 14; // nucleus, neutron, gamma, unresolved_contact
  bool known_moment = 15;
  double kinetic_mev = 16; // photons : energie totale
}
message CollisionSample {
  double time_s = 1;
  string phase = 2;
  repeated CollisionBody bodies = 3;
  double coulomb_n = 4;
  double nuclear_n = 5;
