tasks.register('fusionLivePreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.genesis.fusion.FusionLivePreview'
    args findProperty('out') ?: '../../artifacts/fusion-live',
         findProperty('a') ?: '3007', findProperty('b') ?: '118294',
         findProperty('energy') ?: '40000', findProperty('force') ?: 'false',
         findProperty('genesisPort') ?: '50051'
}
