# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Désactivé : le plugin JavaFX (org.openjfx.javafxplugin) accède à Task.extensions
# pendant l'exécution de la tâche 'run', ce qui est interdit par le cache de
# configuration. Aucune version du plugin ne le supporte à ce jour.
# À réactiver si le plugin devient compatible.
org.gradle.configuration-cache=false
